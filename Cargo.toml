[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"
cvm-common = { path = "contracts/common" }
arena = { path = "contracts/arena" }

[workspace.lints.rust]
# En Windows (MSVC) cada test imprime "Creando biblioteca …dll.lib": ruido, no un error
linker_messages = "allow"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# `stellar contract build --profile release-with-logs` para ver logs de debug
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
